<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cloud browser recording</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#111827;color:#e5e7eb;font:14px system-ui,sans-serif}
    body{display:flex;flex-direction:column}video{display:block;flex:1;min-height:0;width:100%;background:#030712;object-fit:contain}
    footer{display:flex;gap:14px;align-items:center;min-height:48px;padding:10px 14px}p{flex:1;margin:0;line-height:1.4}
    button{padding:7px 13px;border:1px solid #64748b;border-radius:6px;color:#fff;background:#334155;cursor:pointer}
    button:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}[hidden]{display:none!important}
  </style>
</head>
<body>
  <video id="recording" controls playsinline preload="metadata" aria-label="Cloud browser recording"></video>
  <footer><p id="replay-status" role="status">Loading recording…</p><button id="replay-retry" type="button" hidden>Retry recording</button></footer>
  <script src="./hls.js"></script>
  <script src="./player.js"></script>
</body>
</html>
