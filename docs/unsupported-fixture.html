<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browser Teacher unsupported-page fixture</title>
<!--
  Pages the teaching layer genuinely cannot work on, so the refusal path can be
  checked without hunting down a real canvas app.

  Each case is reached with a query string. The panel should mount, decide it
  has nothing to point at, name the specific obstacle, and lock the chat bar:

    ?case=canvas      a canvas fills the viewport          -> "draws its interface on a canvas"
    ?case=framed      the UI is inside an iframe           -> "inside an embedded frame"
    ?case=unlabelled  plenty of controls, none named       -> "none of them are labelled"
    ?case=bare        almost nothing on the page           -> "can't find anything to point at"
    (no query)        an index of the four

  The support probe applies on loopback hosts, so these work straight off
  `python3 -m http.server 8765`. Site scoping does NOT — see docs/new-sites.md.
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #192536; background: #edf2f8; }
  main { padding: 28px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { margin: 0 0 18px; color: #4a5c72; }
  ul { padding-left: 20px; }
  a { color: #113c69; }
  canvas { display: block; background: #1d2b3a; }
  iframe { display: block; border: 0; }
  .plain { font: inherit; padding: 9px 14px; margin: 5px; border: 1px solid #416d9a;
           border-radius: 6px; background: #f5f9fe; color: #113c69; }
</style>
<body>
<script>
  const which = new URL(location.href).searchParams.get('case') || '';

  function index() {
    document.body.innerHTML = `
      <main>
        <h1>Unsupported-page fixture</h1>
        <p>Each link below is a page the teaching layer cannot work on. The panel
           should refuse it by name rather than accepting questions it can't answer.</p>
        <ul>
          <li><a href="?case=canvas">canvas</a> — the interface is painted, not built</li>
          <li><a href="?case=framed">framed</a> — the interface is inside an iframe</li>
          <li><a href="?case=unlabelled">unlabelled</a> — controls exist, none are named</li>
          <li><a href="?case=bare">bare</a> — there is almost nothing here</li>
        </ul>
        <p>This index page itself has too few controls to teach, so it also
           exercises the <code>bare</code> message.</p>
      </main>`;
  }

  function canvas() {
    // Whole-viewport canvas with nothing behind it: Figma, Miro, Maps.
    const c = document.createElement('canvas');
    c.width = window.innerWidth;
    c.height = window.innerHeight;
    document.body.appendChild(c);
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#1d2b3a';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = '#9fb4cc';
    ctx.font = '16px system-ui, sans-serif';
    ctx.fillText('Every "button" on this page is painted pixels.', 30, 50);
    ctx.fillText('There is no element to point at, and no lesson could change that.', 30, 78);
    ctx.strokeStyle = '#4a6a8c';
    for (const [x, label] of [[30, 'File'], [110, 'Edit'], [190, 'View']]) {
      ctx.strokeRect(x, 110, 70, 32);
      ctx.fillText(label, x + 14, 132);
    }
  }

  function framed() {
    // Same-origin, but we only ever query our own frame, so its controls are
    // as far out of reach as a cross-origin app's would be.
    const controls = Array.from({ length: 12 }, (_, i) =>
      `<button class="plain" aria-label="Framed action ${i + 1}">Framed action ${i + 1}</button>`).join('');
    const inner = `<!doctype html><meta charset="utf-8">
      <body style="margin:0;font:16px/1.5 system-ui,sans-serif;background:#fff;padding:24px">
      <h1 style="font-size:20px">The real app lives in here</h1>
      <p>Twelve perfectly nameable controls that the panel cannot see.</p>${controls}`;
    const frame = document.createElement('iframe');
    frame.style.width = '100%';
    frame.style.height = `${window.innerHeight}px`;
    frame.srcdoc = inner;
    document.body.appendChild(frame);
  }

  function unlabelled() {
    // The commonest real-world version of this: icon buttons with no name.
    // The controls are here, they are enabled, they are visible, and there is
    // still no sentence the panel could say about which one to click.
    const main = document.createElement('main');
    main.innerHTML = `
      <h1>Icon-only toolbar</h1>
      <p>Twenty controls, not one accessible name between them. This is the
         site's accessibility, and nothing on our side can work around it.</p>`;
    const bar = document.createElement('div');
    for (let i = 0; i < 20; i++) {
      const b = document.createElement('button');
      b.className = 'plain';
      // No text, no aria-label, no title — deliberately.
      b.innerHTML = '<svg width="16" height="16" aria-hidden="true">'
        + '<rect width="16" height="16" rx="3" fill="#416d9a"></rect></svg>';
      bar.appendChild(b);
    }
    main.appendChild(bar);
    document.body.appendChild(main);
  }

  function bare() {
    document.body.innerHTML = `
      <main>
        <h1>Nothing to teach</h1>
        <p>A page of prose with no controls on it. Nothing has gone wrong — there
           is simply no interface here to point at.</p>
      </main>`;
  }

  const cases = { canvas, framed, unlabelled, bare };
  (cases[which] || index)();
</script>
</body>
</html>
